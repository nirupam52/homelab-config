name: pihole

services:
  pihole:
    image: pihole/pihole:2026.10.1@sha256:30f803ad5dd60ff96cc0a63008a2e9271af481c1b0399a182192b2e91152c1f9
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD:?Set PIHOLE_WEBPASSWORD in .env}
      FTLCONF_webserver_port: "80"
      FTLCONF_dns_listeningMode: ALL
    ports:
      - "${TAILSCALE_IPV4:?Set TAILSCALE_IPV4 in .env}:53:53/udp"
      - "${TAILSCALE_IPV4:?Set TAILSCALE_IPV4 in .env}:53:53/tcp"
    volumes:
      - /mnt/ssd/homelab/apps/pihole/data:/etc/pihole
      - /mnt/ssd/homelab/apps/pihole/dnsmasq.d:/etc/dnsmasq.d
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=pihole"
      - "docktail.service.port=80"
      - "docktail.service.service-port=443"
