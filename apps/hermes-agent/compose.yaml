name: hermes-agent

networks:
  llama-cpp:
    name: llama-cpp
    external: true

services:
  hermes:
    image: nousresearch/hermes-agent:v2026.9.21@sha256:6bece0644e29a347e5ae17db43c36938c86f171c6f5e0cef18aa2075d331f3a3
    restart: unless-stopped
    networks:
      - llama-cpp
    environment:
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USERNAME:?Set HERMES_DASHBOARD_USERNAME in .env}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:?Set HERMES_DASHBOARD_PASSWORD in .env}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_SECRET:?Set HERMES_DASHBOARD_SECRET in .env}
    volumes:
      - /mnt/ssd/homelab/apps/hermes-agent/data:/opt/data
    command: ["dashboard", "--host", "0.0.0.0", "--no-open"]
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=hermes"
      - "docktail.service.port=9119"
      - "docktail.service.service-port=443"
