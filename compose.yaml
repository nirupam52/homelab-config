name: homelab

services:
  pihole:
    image: pihole/pihole:2026.07.2
    environment:
      TZ: ${TZ:-UTC}
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD:?Set PIHOLE_WEBPASSWORD in .env}
      FTLCONF_webserver_port: "80"
      FTLCONF_dns_listeningMode: "ALL"
    ports:
      - "${TAILSCALE_IPV4:?Set TAILSCALE_IPV4 in .env}:53:53/tcp"
      - "${TAILSCALE_IPV4:?Set TAILSCALE_IPV4 in .env}:53:53/udp"
      - "127.0.0.1:8081:80/tcp"
    volumes:
      - pihole:/etc/pihole
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:v10.9.2
    command: ["--no-analytics"]
    ports:
      - "127.0.0.1:8080:8080/tcp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  pihole:
    name: homelab_pihole
