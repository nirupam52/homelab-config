name: homelab

services:
  pihole:
    image: pihole/pihole:2026.07.2@sha256:a29ad980775f38a8e7524a206ff9c125bc6fcfd9de8de1fc93d2de0671cc1d34
    environment:
      TZ: ${TZ:-UTC}
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD:?Set PIHOLE_WEBPASSWORD in .env}
      FTLCONF_webserver_port: "80"
      FTLCONF_dns_listeningMode: "ALL"
    ports:
      - "${TAILSCALE_IPV4:?Set TAILSCALE_IPV4 in .env}:53:53/tcp"
      - "${TAILSCALE_IPV4:?Set TAILSCALE_IPV4 in .env}:53:53/udp"
      - "127.0.0.1:8081:80/tcp"
    volumes:
      - pihole:/etc/pihole
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:v10.9.2@sha256:3d16399007c952832fecea05a176f873a3e32604d1805a68930edbea5a81b324
    command: ["--no-analytics"]
    ports:
      - "127.0.0.1:8080:8080/tcp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  pihole:
    name: homelab_pihole
