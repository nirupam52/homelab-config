name: docktail

services:
  docktail:
    image: ghcr.io/marvinvr/docktail:1.8.7@sha256:70d50c6167dc463687402e8a7d2833dd583862dfeab0b398fc92bf166a924da8
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/tailscale:/var/run/tailscale
    environment:
      TAILSCALE_OAUTH_CLIENT_ID: ${TAILSCALE_OAUTH_CLIENT_ID:?Set TAILSCALE_OAUTH_CLIENT_ID in .env}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${TAILSCALE_OAUTH_CLIENT_SECRET:?Set TAILSCALE_OAUTH_CLIENT_SECRET in .env}
      DEFAULT_SERVICE_TAGS: tag:container
