name: Image scan

# Dependabot alerts do not cover container images. This scans every image the
# stack runs with Trivy and reports to the Security tab (Code scanning). It
# never fails the build; triage findings in the Security tab.

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/**"
      - "infra/**"
      - ".github/workflows/image-scan.yml"

permissions:
  contents: read

concurrency:
  group: image-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Read the images from the compose files so a Dependabot bump or a new
      # service is scanned without touching this workflow. hermes-sandbox:local
      # is built from source in the sandbox job instead.
      - id: list
        run: |
          images=$(grep -rhE '^\s*image:' apps infra --include=compose.yaml \
            | sed -E 's/^\s*image:\s*//' \
            | grep -v ':local$' | sort -u \
            | jq -R '{ref: ., name: (split("@")[0] | split(":")[0] | gsub("[^a-zA-Z0-9]"; "-"))}' \
            | jq -sc .)
          echo "images=$images" >> "$GITHUB_OUTPUT"

  images:
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.matrix.outputs.images) }}
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # The Pi is arm64; scan that variant of the multi-arch image.
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ matrix.image.ref }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.image.name }}

  sandbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Built for the runner's platform (amd64); the package set is the same.
      - run: docker build -t hermes-sandbox:local apps/hermes-agent/sandbox
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hermes-sandbox:local
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-hermes-sandbox
