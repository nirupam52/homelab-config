name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Warnings and errors only. The remaining info-level findings are
      # intentional: an unquoted package list and SC2094 on `>> "$BOOT_CONFIG"`.
      - run: shellcheck --severity=warning setup.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The compose files require secrets from runtime .env files. Dummy
      # values let `config` parse and validate them without any real secret.
      - name: Validate compose files
        env:
          HERMES_DASHBOARD_USERNAME: ci
          HERMES_DASHBOARD_PASSWORD: ci
          HERMES_DASHBOARD_SECRET: ci
          PIHOLE_WEBPASSWORD: ci
          TAILSCALE_IPV4: 100.64.0.1
          TAILSCALE_OAUTH_CLIENT_ID: ci
          TAILSCALE_OAUTH_CLIENT_SECRET: ci
        run: |
          set -eu
          for f in apps/*/compose.yaml infra/*/compose.yaml; do
            echo "::group::$f"
            docker compose -f "$f" config --quiet
            echo "::endgroup::"
          done
